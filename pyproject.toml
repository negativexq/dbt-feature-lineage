[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-feature-lineage"
version = "0.1.0"
description = "Local, open-source dbt model and column lineage explorer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "dbt-core",
  "dbt-postgres",
  "pandas",
  # Unpinned, this project's own pydantic v2 code (ConfigDict, model_dump)
  # is at the mercy of which dbt-core version pip's resolver happens to
  # land on -- dbt-core<1.12 pins pydantic<2, and adding one more
  # dependency (streamlit-flow-component) was enough to flip the
  # resolver onto one of those older releases, silently downgrading
  # pydantic and breaking every frozen/hashable model in the app
  # (verified: this exact regression, during v0.5 development).
  "pydantic>=2",
  "pyyaml",
  "sqlglot",
  # Already pulled in transitively by dbt-core, but sql_parser.py imports
  # it directly to actually render dbt Jinja ({% set %}/{% for %} control
  # flow, not just {{ ref() }}/{{ source() }} calls) instead of leaving
  # it to whatever version dbt-core's own resolver happens to land on.
  "jinja2",
  "networkx",
  "streamlit",
  "streamlit-flow-component",
  "typer",
  "rich",
  # New web backend (src/dbt_feature_lineage/api/), replacing the Streamlit
  # UI -- pinned to a minimum version deliberately: this project has hit
  # two real regressions from unpinned dependencies drifting underneath it
  # (pydantic silently downgraded via dbt-core's own pin, and Streamlit's
  # AppTest.from_file() changing its relative-path resolution semantics in
  # a later release), so new dependencies get a floor from day one instead
  # of learning the same lesson a third time.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
dbt-feature-lineage = "dbt_feature_lineage.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
