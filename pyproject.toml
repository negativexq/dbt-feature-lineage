[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-feature-lineage"
version = "0.1.0"
description = "Local, open-source dbt model and column lineage explorer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dbt-core",
  "dbt-postgres",
  "pydantic",
  "pyyaml",
  "sqlglot",
  "networkx",
  "typer",
  "rich",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

