[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-feature-lineage"
version = "0.1.0"
description = "Local, open-source dbt model and column lineage explorer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dbt-core",
  "dbt-postgres",
  "pandas",
  # Unpinned, this project's own pydantic v2 code (ConfigDict, model_dump)
  # is at the mercy of which dbt-core version pip's resolver happens to
  # land on -- dbt-core<1.12 pins pydantic<2, and adding one more
  # dependency (streamlit-flow-component) was enough to flip the
  # resolver onto one of those older releases, silently downgrading
  # pydantic and breaking every frozen/hashable model in the app
  # (verified: this exact regression, during v0.5 development).
  "pydantic>=2",
  "pyyaml",
  "sqlglot",
  "networkx",
  "streamlit",
  "streamlit-flow-component",
  "typer",
  "rich",
]

[project.scripts]
dbt-feature-lineage = "dbt_feature_lineage.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
