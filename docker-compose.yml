services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
    volumes:
      - .:/app
    command: sh -c "while true; do sleep 3600; done"
    healthcheck:
      test: ["CMD", "python", "-c", "import dbt_feature_lineage"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

